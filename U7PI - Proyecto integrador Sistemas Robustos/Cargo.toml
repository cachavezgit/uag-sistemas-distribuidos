[package]
name = "gato-p2p"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
# RPC framework de Google para Rust
tarpc = { version = "0.37", features = ["tokio1", "serde-transport", "tcp"] }

# Runtime asíncrono (requerido por tarpc)
tokio = { version = "1", features = ["full"] }

# Serialización de argumentos RPC y lectura de usuarios.json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-serde = { version = "0.9", features = ["json"] }

# Interfaz de terminal
ratatui = "0.29"
crossterm = "0.28"

# Utilidades async
futures = "0.3"
anyhow = "1.0"
base64 = "0.22"
ratatui-explorer = "0.2"
rpassword = "7"

# Videollamada: captura de cámara + codificación de frames.
# Opcional: en sistemas sin libclang (p.ej. Raspberry Pi sin dev tools)
# compilar sin este feature para solo recibir/reproducir video vía mpv.
# Con cámara:    cargo build --features camera
# Sin cámara:    cargo build               (default)
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
image = { version = "0.25", optional = true }

[features]
camera = ["dep:nokhwa", "dep:image"]
